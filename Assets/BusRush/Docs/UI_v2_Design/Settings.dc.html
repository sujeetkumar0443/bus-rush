<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFF3B0}

@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-40px) scale(.8);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes shine{0%{transform:translateX(-80px) skewX(-20deg)}60%,100%{transform:translateX(320px) skewX(-20deg)}}
.fade{animation:fade .25s ease-out both}
.panel{animation:popIn .45s cubic-bezier(.3,1.5,.5,1) .05s both}
.ribbon{animation:drop .45s cubic-bezier(.3,1.5,.5,1) .2s both}
.rays{animation:spin 14s linear infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.floaty{animation:floaty 2.2s ease-in-out infinite}
.rise{animation:rise .45s ease-out both}
.shine{animation:shine 2.4s ease-in-out 1s infinite}

</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k) => st[k] !== false;
    const out = {};
    ['sound', 'music', 'vib'].forEach((k) => {
      out[k + 'On'] = v(k) ? 'true' : 'false';
      out[k + 'Track'] = v(k) ? '#4CC92F' : '#B8C2D6';
      out[k + 'Knob'] = v(k) ? 30 : 2;
      out[k + 'Toggle'] = () => this.setState({ [k]: !v(k) });
    });
    return out;
  }
}
</script>
