<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k) => st[k] !== false;
    const out = {};
    ['sound', 'music', 'vib'].forEach((k) => {
      out[k + 'On'] = v(k) ? 'true' : 'false';
      out[k + 'Track'] = v(k) ? '#4CC92F' : '#B8C2D6';
      out[k + 'Knob'] = v(k) ? 30 : 2;
      out[k + 'Toggle'] = () => this.setState({ [k]: !v(k) });
    });
    return out;
  }
}
