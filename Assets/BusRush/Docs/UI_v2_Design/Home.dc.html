@keyframes fly{0%{transform:translate(-150px,0)}75%{transform:translate(430px,-30px)}100%{transform:translate(430px,-30px)}}

@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.01)}}
@keyframes exhaust{0%{opacity:.85;transform:translate(0,0) scale(.35)}100%{opacity:0;transform:translate(-46px,-34px) scale(1.7)}}

@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes popIn{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fly{position:absolute;left:0;top:118px;animation:fly 10s linear infinite}
.bobP{animation:bobP 1.6s ease-in-out infinite}
.puff{position:absolute;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,0.85) 45%,rgba(255,255,255,0) 72%);opacity:0;animation:trail 10s linear infinite both}
.idle{animation:idle 1.4s ease-in-out infinite;transform-origin:50% 100%}
.exh{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,rgba(235,238,245,0.95) 0%,rgba(220,225,235,0.6) 50%,rgba(255,255,255,0) 72%);animation:exhaust 1.5s ease-out infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.wob{animation:wobble 2.4s ease-in-out infinite;transform-origin:50% 90%}
.dot{animation:dot 1s ease-in-out infinite}
.floaty{animation:floaty 2s ease-in-out infinite}
.popIn{animation:popIn .35s cubic-bezier(.3,1.5,.5,1) both}
.fade{animation:fade .2s ease-out both}

</style>
