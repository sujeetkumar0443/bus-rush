@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@keyframes shine{0%{transform:translateX(-80px) skewX(-20deg)}60%,100%{transform:translateX(320px) skewX(-20deg)}}

.pulse{animation:pulse 1.2s ease-in-out infinite}
.floaty{animation:floaty 2.2s ease-in-out infinite}
.rise{animation:rise .45s ease-out both}
.shine{animation:shine 2.4s ease-in-out 1s infinite}

@keyframes blink{0%,100%{background:#FFF6B0;box-shadow:0 0 8px 2px #FFE27A}50%{background:#FFFFFF;box-shadow:none}}
.bulb{position:absolute;width:12px;height:12px;border-radius:50%;animation:blink .8s linear infinite}
.wheel{transition:transform 4.2s cubic-bezier(.12,.75,.15,1)}

class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    return {
      wheelRot: st.rot || 0,
      won: !!st.won,
      spin: () => {
        if (st.rot) return;
        this.setState({ rot: 360 * 6 - 202.5 });
        setTimeout(() => this.setState({ won: true }), 4400);
      }
    };
  }
}
